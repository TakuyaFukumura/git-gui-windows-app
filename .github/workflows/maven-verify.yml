name: Maven verify

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      maven-command:
        description: Maven Wrapper command for the runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 24のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: ビルドとテスト
        run: ${{ inputs.maven-command }} -B clean verify
