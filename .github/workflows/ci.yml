name: CI

# トリガー設定
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 実行環境とジョブの設定
jobs:
  # メインビルドジョブ（Ubuntu）
  build:
    uses: ./.github/workflows/maven-verify.yml
    with:
      runner: ubuntu-latest
      maven-command: ./mvnw
  
  # クロスプラットフォームテスト
  cross-platform-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            maven-command: .\mvnw.cmd
          - os: macos-latest
            maven-command: ./mvnw

    uses: ./.github/workflows/maven-verify.yml
    with:
      runner: ${{ matrix.os }}
      maven-command: ${{ matrix.maven-command }}
